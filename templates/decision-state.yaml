# Decision State Template — v0.3
#
# Internal structure for tracking a decision as it evolves.
# NOT for display to end users.
#
# Two modes, selected by Complexity Gate:
#   LITE — MEDIUM complexity (use only the fields marked [LITE])
#   FULL — HIGH complexity (use all fields)
#
# Usage: Update fields as new information arrives.

# ==================== LITE MODE (MEDIUM complexity) ====================

decision_id: ""             # [LITE] Unique identifier for this decision session

user_goal: ""               # [LITE] What does the user ultimately want?

facts: []                   # [LITE] User stated, confirmed, or reliably evidenced

key_unknown: ""             # [LITE] The single unknown most likely to flip the recommendation

candidate_strategies: []    # [LITE] Strategy IDs under consideration (2-3 max)

main_trigger: ""            # [LITE] The event most likely to force re-evaluation

current_lean: ""            # [LITE] Provisional direction based on current information

# ==================== FULL MODE EXTENSIONS (HIGH complexity) ====================

desired_outcome: ""         # What does "success" concretely look like?

secondary_goals: []         # Subsidiary goals that still matter

constraints: []             # Hard limits the user cannot (or should not) violate

assumptions: []             # What the strategy depends on but is unconfirmed

unknowns: []                # All unknowns that could affect the recommendation

stakeholders:               # Anyone affected by or able to affect the outcome
  - actor: ""
    role: ""
    goals: []
    knowledge: []
    constraints: []
    possible_actions: []

dependencies: []            # External conditions that must hold for the plan to work

commitments: []             # Promises or obligations the user has already made

triggers: []                # Events that would force a re-evaluation

recovery_path: ""           # How to recover if the chosen strategy fails

confidence: ""              # low / medium / high

last_updated_reason: ""     # What new fact or analysis caused the last update?
